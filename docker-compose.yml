name: ap-agent

x-db-env: &db-env
  DATABASE_URL: postgres://ap:ap@postgres:5432/ap?sslmode=disable

services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: ap
      POSTGRES_PASSWORD: ap
      POSTGRES_DB: ap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ap -d ap"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: migrate
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: seed
    environment: *db-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      target: api
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      PAYMENT_MOCK_URL: http://payment-mock:4000
      SAMPLES_DIR: /samples
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
      payment-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  payment-mock:
    build:
      context: .
      target: payment-mock
    env_file:
      - path: .env
        required: false
    environment: *db-env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/payment-mock", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
