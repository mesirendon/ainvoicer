server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 180s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
